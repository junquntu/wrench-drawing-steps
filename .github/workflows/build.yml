name: build-wrench-steps

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview（快速自检） 或 full（全片）'
        required: true
        default: 'full'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy imageio-ffmpeg

      - name: Fetch CJK font
        run: |
          mkdir -p assets
          curl -L --retry 3 -o assets/NotoSansCJKsc-Regular.otf \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          ls -lh assets/

      - name: Build
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = "preview" ]; then
            python wrench/build.py --preview
          else
            python wrench/build.py --full
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wrench-drawing-steps
          path: docs/
          retention-days: 30

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "build: 更新分步图与视频 [skip ci]"
            git push
          fi
